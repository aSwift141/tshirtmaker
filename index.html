<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Shirt AI Design Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .job-card {
            transition: all 0.2s;
        }
        .image-wrapper {
            position: relative;
            aspect-ratio: 1;
        }
        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .action-btn {
            font-size: 11px;
            padding: 4px 8px;
            min-width: 36px;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">
    <!-- Header -->
    <div class="bg-white shadow-sm px-6 py-4 flex-shrink-0">
        <h1 class="text-2xl font-bold text-gray-800">T-Shirt AI Design Generator</h1>
        <p class="text-sm text-gray-600">Create stunning t-shirt designs with AI</p>
    </div>

    <!-- Main Container -->
    <div class="flex flex-1 overflow-hidden">
        <!-- Left Sidebar (1/3) -->
        <div class="w-1/3 bg-white border-r border-gray-200 overflow-y-auto flex-shrink-0">
            <div class="p-6">
                <!-- API Key Section -->
                <div class="mb-6">
                    <h2 class="text-lg font-semibold text-gray-800 mb-3">API Configuration</h2>
                    <label for="apiKey" class="block text-sm font-medium text-gray-700 mb-2">PiAPI Key</label>
                    <input
                        type="password"
                        id="apiKey"
                        placeholder="Enter your PiAPI key"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
                    >
                    <p class="text-xs text-gray-500 mt-1">Get your key from <a href="https://piapi.ai" target="_blank" class="text-blue-500 hover:underline">piapi.ai</a></p>
                </div>

                <hr class="my-6">

                <!-- Design Inputs -->
                <div>
                    <h2 class="text-lg font-semibold text-gray-800 mb-3">Design Inputs</h2>

                    <!-- JSON Input (Optional) -->
                    <div class="mb-4">
                        <label for="jsonInput" class="block text-sm font-medium text-gray-700 mb-2">
                            JSON Style Guide <span class="text-gray-400">(Optional)</span>
                        </label>
                        <textarea
                            id="jsonInput"
                            rows="3"
                            placeholder='{"style": "minimalist", "colors": ["black", "white"]}'
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent font-mono text-xs"
                        ></textarea>
                    </div>

                    <!-- Reference Images (Optional) -->
                    <div class="mb-4">
                        <label for="referenceImages" class="block text-sm font-medium text-gray-700 mb-2">
                            Reference Images <span class="text-gray-400">(Optional)</span>
                        </label>
                        <input
                            type="file"
                            id="referenceImages"
                            multiple
                            accept="image/*"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"
                        >
                        <div id="imagePreview" class="mt-2 flex flex-wrap gap-2"></div>
                    </div>

                    <!-- Design Prompt (Required) -->
                    <div class="mb-4">
                        <label for="designPrompt" class="block text-sm font-medium text-gray-700 mb-2">
                            Design Prompt <span class="text-red-500">*</span>
                        </label>
                        <textarea
                            id="designPrompt"
                            rows="4"
                            placeholder="Describe your t-shirt design..."
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
                            required
                        ></textarea>
                    </div>

                    <!-- Quantity Selector -->
                    <div class="mb-6">
                        <label for="quantity" class="block text-sm font-medium text-gray-700 mb-2">
                            Number of Designs per Job
                        </label>
                        <select
                            id="quantity"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm"
                        >
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4" selected>4</option>
                        </select>
                    </div>

                    <!-- Generate Button -->
                    <button
                        id="generateBtn"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center"
                    >
                        <span id="generateBtnText">Generate Designs</span>
                        <div id="generateLoader" class="loading ml-3 hidden"></div>
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Content Area (2/3) -->
        <div class="w-2/3 overflow-y-auto bg-gray-50">
            <div class="p-6">
                <!-- Jobs Container -->
                <div id="jobsContainer">
                    <!-- Empty State -->
                    <div id="emptyState" class="flex flex-col items-center justify-center py-20 text-gray-400">
                        <svg class="w-24 h-24 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        <p class="text-lg font-medium">No designs yet</p>
                        <p class="text-sm">Start by entering a prompt and clicking Generate</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State management
        let jobs = []; // Array of job objects
        let referenceImagesBase64 = [];
        let jobIdCounter = 0;

        // DOM elements
        const apiKeyInput = document.getElementById('apiKey');
        const jsonInput = document.getElementById('jsonInput');
        const referenceImagesInput = document.getElementById('referenceImages');
        const imagePreview = document.getElementById('imagePreview');
        const designPrompt = document.getElementById('designPrompt');
        const quantityInput = document.getElementById('quantity');
        const generateBtn = document.getElementById('generateBtn');
        const generateBtnText = document.getElementById('generateBtnText');
        const generateLoader = document.getElementById('generateLoader');
        const jobsContainer = document.getElementById('jobsContainer');
        const emptyState = document.getElementById('emptyState');

        // Handle reference images upload
        referenceImagesInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            imagePreview.innerHTML = '';
            referenceImagesBase64 = [];

            for (const file of files) {
                // Create preview
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'w-16 h-16 object-cover rounded border border-gray-300';
                    imagePreview.appendChild(img);
                };
                reader.readAsDataURL(file);

                // Convert to base64 for API
                const base64 = await fileToBase64(file);
                referenceImagesBase64.push(base64);
            }
        });

        // Convert file to base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Generate designs
        generateBtn.addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            const prompt = designPrompt.value.trim();
            const quantity = parseInt(quantityInput.value);

            if (!apiKey) {
                alert('Please enter your PiAPI key');
                return;
            }

            if (!prompt) {
                alert('Please enter a design prompt');
                return;
            }

            // Create new job
            const job = {
                id: ++jobIdCounter,
                prompt: prompt,
                jsonGuide: jsonInput.value.trim(),
                quantity: quantity,
                images: [],
                status: 'generating',
                timestamp: new Date()
            };

            jobs.unshift(job); // Add to beginning
            renderJobs();

            // Disable button
            generateBtn.disabled = true;
            generateBtnText.textContent = 'Generating...';
            generateLoader.classList.remove('hidden');

            try {
                // Generate images one by one
                for (let i = 0; i < quantity; i++) {
                    console.log(`Starting generation ${i + 1}/${quantity} for job #${job.id}`);
                    updateJobStatus(job.id, `Generating ${i + 1}/${quantity}...`);

                    const design = await generateDesign(
                        apiKey,
                        prompt,
                        jsonInput.value.trim(),
                        referenceImagesBase64
                    );

                    console.log(`Design ${i + 1}/${quantity} completed:`, design);
                    job.images.push(design);

                    // Update the UI immediately to show the new image
                    renderJobs();
                    console.log(`Job #${job.id} now has ${job.images.length}/${quantity} images`);
                }

                job.status = 'completed';
                updateJobStatus(job.id, 'Completed');
                console.log(`Job #${job.id} fully completed with ${job.images.length} images`);
            } catch (error) {
                job.status = 'failed';
                job.error = error.message;
                updateJobStatus(job.id, 'Failed: ' + error.message);
                alert('Error generating designs: ' + error.message);
                console.error(error);
            } finally {
                generateBtn.disabled = false;
                generateBtnText.textContent = 'Generate Designs';
                generateLoader.classList.add('hidden');
            }
        });

        // Generate a single design using PiAPI
        async function generateDesign(apiKey, userPrompt, jsonGuide, refImages) {
            // Construct the full prompt
            let fullPrompt = "You are an expert T-shirt designer, your job is to create a design with 30-50% negative space, plain background, no mockup whatsoever, only the design using the json below as a design style guide if found, and the user's design prompt below.\n\n";

            if (jsonGuide) {
                fullPrompt += "JSON:\n" + jsonGuide + "\n\n";
            } else {
                fullPrompt += "JSON:\nNone\n\n";
            }

            fullPrompt += "PROMPT:\n" + userPrompt + "\n\n";
            fullPrompt += "generate the image only, do not respond to this message.";

            // Prepare the request body using PiAPI's unified API schema
            const requestBody = {
                model: "gemini",
                task_type: "nano-banana-pro",
                input: {
                    prompt: fullPrompt,
                    output_format: "png",
                    aspect_ratio: "1:1",
                    resolution: "1K",
                    safety_level: "high"
                }
            };

            // Add reference images if provided (max 3 for best results)
            if (refImages && refImages.length > 0) {
                requestBody.input.reference_images = refImages.slice(0, 3);
            }

            // Make API request to PiAPI
            const response = await fetch('https://api.piapi.ai/api/v1/task', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-api-key': apiKey
                },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`API request failed: ${response.status} ${response.statusText} - ${errorText}`);
            }

            const data = await response.json();
            console.log('API Response:', data);

            // Extract task_id from response
            let taskId = null;
            if (data.task_id) {
                taskId = data.task_id;
            } else if (data.data && data.data.task_id) {
                taskId = data.data.task_id;
            } else if (data.images && data.images.length > 0) {
                return { url: data.images[0], taskId: data.task_id };
            } else {
                console.error('Unexpected response format:', data);
                throw new Error(`Unexpected API response format: ${JSON.stringify(data)}`);
            }

            return await pollForResult(apiKey, taskId);
        }

        // Poll for task result
        async function pollForResult(apiKey, taskId, maxAttempts = 60) {
            for (let i = 0; i < maxAttempts; i++) {
                await new Promise(resolve => setTimeout(resolve, 3000)); // Wait 3 seconds

                const response = await fetch(`https://api.piapi.ai/api/v1/task/${taskId}`, {
                    headers: {
                        'x-api-key': apiKey
                    }
                });

                if (!response.ok) {
                    throw new Error(`Failed to check task status: ${response.status}`);
                }

                const result = await response.json();
                console.log(`Poll attempt ${i + 1}:`, result);
                console.log('Full result structure:', JSON.stringify(result, null, 2));

                // Check for completion in nested structure
                let data = result.data || result;

                if (data.status === 'completed' || data.status === 'success' || data.status === 'succeeded') {
                    console.log('Task completed! Looking for image URL...');
                    console.log('data object:', data);

                    // Try different paths for the image URL
                    let imageUrl = null;

                    // Check all possible paths
                    if (data.output && data.output.image_urls && data.output.image_urls.length > 0) {
                        imageUrl = data.output.image_urls[0];
                        console.log('Found URL in data.output.image_urls[0]:', imageUrl);
                    } else if (data.output && data.output.images && data.output.images.length > 0) {
                        imageUrl = data.output.images[0];
                        console.log('Found URL in data.output.images[0]:', imageUrl);
                    } else if (data.output && data.output.image_url) {
                        imageUrl = data.output.image_url;
                        console.log('Found URL in data.output.image_url:', imageUrl);
                    } else if (data.output && typeof data.output === 'string') {
                        imageUrl = data.output;
                        console.log('Found URL in data.output (string):', imageUrl);
                    } else if (data.images && data.images.length > 0) {
                        imageUrl = data.images[0];
                        console.log('Found URL in data.images[0]:', imageUrl);
                    } else if (data.image_urls && data.image_urls.length > 0) {
                        imageUrl = data.image_urls[0];
                        console.log('Found URL in data.image_urls[0]:', imageUrl);
                    } else if (data.image_url) {
                        imageUrl = data.image_url;
                        console.log('Found URL in data.image_url:', imageUrl);
                    } else if (data.url) {
                        imageUrl = data.url;
                        console.log('Found URL in data.url:', imageUrl);
                    } else if (typeof data.output === 'object' && data.output !== null) {
                        // Check if output has any property that looks like a URL
                        for (let key in data.output) {
                            if (typeof data.output[key] === 'string' && data.output[key].includes('http')) {
                                imageUrl = data.output[key];
                                console.log(`Found URL in data.output.${key}:`, imageUrl);
                                break;
                            }
                        }
                    }

                    if (imageUrl) {
                        console.log('Successfully extracted image URL:', imageUrl);
                        return { url: imageUrl, taskId: taskId };
                    } else {
                        console.error('Could not find image URL in completed response:', data);
                    }
                }

                if (data.status === 'failed' || data.status === 'error') {
                    const errorMsg = data.error || data.message || 'Image generation failed';
                    throw new Error(errorMsg);
                }

                // Continue polling if still processing
            }

            throw new Error('Timeout waiting for image generation');
        }

        // Update job status
        function updateJobStatus(jobId, status) {
            const job = jobs.find(j => j.id === jobId);
            if (job) {
                job.statusText = status;
                renderJobs();
            }
        }

        // Render all jobs
        function renderJobs() {
            if (jobs.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            jobsContainer.innerHTML = jobs.map(job => createJobCard(job)).join('');
        }

        // Create job card HTML
        function createJobCard(job) {
            const timestamp = job.timestamp.toLocaleTimeString();
            const isComplete = job.status === 'completed' && job.images.length === job.quantity;

            return `
                <div class="job-card bg-white rounded-lg shadow-md p-4 mb-6">
                    <!-- Job Header -->
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-xs font-semibold text-gray-500">Job #${job.id}</span>
                                <span class="text-xs text-gray-400">${timestamp}</span>
                            </div>
                            <p class="text-sm text-gray-700 line-clamp-2">${job.prompt}</p>
                        </div>
                        ${job.status === 'generating' ? `
                            <div class="flex items-center gap-2 ml-4">
                                <div class="loading"></div>
                                <span class="text-xs text-gray-500">${job.statusText || 'Generating...'}</span>
                            </div>
                        ` : ''}
                    </div>

                    ${job.images.length > 0 ? `
                        <!-- Image Grid (2x2) -->
                        <div class="grid grid-cols-2 gap-2 mb-3">
                            ${Array.from({length: 4}).map((_, idx) => {
                                if (job.images[idx]) {
                                    return `
                                        <div class="image-wrapper rounded border border-gray-200 overflow-hidden">
                                            <img src="${job.images[idx].url}" alt="Design ${idx + 1}" loading="lazy">
                                        </div>
                                    `;
                                } else if (job.status === 'generating' && idx < job.quantity) {
                                    return `
                                        <div class="image-wrapper rounded border border-gray-200 bg-gray-100 flex items-center justify-center">
                                            <div class="loading"></div>
                                        </div>
                                    `;
                                } else {
                                    return `
                                        <div class="image-wrapper rounded border border-gray-200 bg-gray-50"></div>
                                    `;
                                }
                            }).join('')}
                        </div>

                        ${isComplete ? `
                            <!-- Action Buttons (Midjourney-style) -->
                            <div class="flex gap-2 text-xs">
                                <div class="flex gap-1">
                                    ${job.images.map((_, idx) => `
                                        <button onclick="upscaleImage(${job.id}, ${idx})"
                                                class="action-btn bg-green-500 hover:bg-green-600 text-white rounded transition">
                                            U${idx + 1}
                                        </button>
                                    `).join('')}
                                </div>
                                <div class="flex gap-1">
                                    ${job.images.map((_, idx) => `
                                        <button onclick="variationImage(${job.id}, ${idx})"
                                                class="action-btn bg-blue-500 hover:bg-blue-600 text-white rounded transition">
                                            V${idx + 1}
                                        </button>
                                    `).join('')}
                                </div>
                                <button onclick="regenerateJob(${job.id})"
                                        class="action-btn bg-gray-500 hover:bg-gray-600 text-white rounded transition ml-auto">
                                    🔄 Regenerate
                                </button>
                            </div>
                        ` : ''}
                    ` : ''}

                    ${job.status === 'failed' ? `
                        <div class="bg-red-50 border border-red-200 rounded p-3 text-sm text-red-700">
                            <strong>Error:</strong> ${job.error || 'Unknown error'}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // Upscale image (create a new job with just that image)
        async function upscaleImage(jobId, imageIndex) {
            const job = jobs.find(j => j.id === jobId);
            if (!job || !job.images[imageIndex]) return;

            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                alert('Please enter your PiAPI key');
                return;
            }

            const selectedImage = job.images[imageIndex];

            // Create new upscale job
            const newJob = {
                id: ++jobIdCounter,
                prompt: `UPSCALE: ${job.prompt}`,
                jsonGuide: job.jsonGuide,
                quantity: 1,
                images: [],
                status: 'generating',
                timestamp: new Date(),
                parentJobId: jobId,
                isUpscale: true
            };

            jobs.unshift(newJob);
            renderJobs();

            try {
                updateJobStatus(newJob.id, 'Upscaling...');

                const editPrompt = `Upscale and enhance this t-shirt design. Make it higher quality and more detailed while maintaining the exact same style and composition. Keep 30-50% negative space, plain background, no mockup whatsoever.`;

                const design = await generateEditedDesign(apiKey, editPrompt, selectedImage.url);

                newJob.images.push(design);
                newJob.status = 'completed';
                updateJobStatus(newJob.id, 'Completed');
            } catch (error) {
                newJob.status = 'failed';
                newJob.error = error.message;
                updateJobStatus(newJob.id, 'Failed: ' + error.message);
                alert('Error upscaling: ' + error.message);
            }
        }

        // Create variation
        async function variationImage(jobId, imageIndex) {
            const job = jobs.find(j => j.id === jobId);
            if (!job || !job.images[imageIndex]) return;

            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                alert('Please enter your PiAPI key');
                return;
            }

            const selectedImage = job.images[imageIndex];

            // Create new variation job with 4 images
            const newJob = {
                id: ++jobIdCounter,
                prompt: `VARIATION: ${job.prompt}`,
                jsonGuide: job.jsonGuide,
                quantity: 4,
                images: [],
                status: 'generating',
                timestamp: new Date(),
                parentJobId: jobId,
                isVariation: true
            };

            jobs.unshift(newJob);
            renderJobs();

            try {
                for (let i = 0; i < 4; i++) {
                    console.log(`Creating variation ${i + 1}/4 for job #${newJob.id}`);
                    updateJobStatus(newJob.id, `Creating variation ${i + 1}/4...`);

                    const editPrompt = `Create a variation of this t-shirt design. Keep the same general theme and style but change details, colors, or composition. Maintain 30-50% negative space, plain background, no mockup whatsoever.`;

                    const design = await generateEditedDesign(apiKey, editPrompt, selectedImage.url);

                    console.log(`Variation ${i + 1}/4 completed:`, design);
                    newJob.images.push(design);

                    // Update the UI immediately
                    renderJobs();
                    console.log(`Job #${newJob.id} now has ${newJob.images.length}/4 variations`);
                }

                newJob.status = 'completed';
                updateJobStatus(newJob.id, 'Completed');
                console.log(`Job #${newJob.id} variations completed`);
            } catch (error) {
                newJob.status = 'failed';
                newJob.error = error.message;
                updateJobStatus(newJob.id, 'Failed: ' + error.message);
                alert('Error creating variations: ' + error.message);
            }
        }

        // Regenerate entire job
        async function regenerateJob(jobId) {
            const job = jobs.find(j => j.id === jobId);
            if (!job) return;

            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                alert('Please enter your PiAPI key');
                return;
            }

            // Create new job with same parameters
            const newJob = {
                id: ++jobIdCounter,
                prompt: job.prompt,
                jsonGuide: job.jsonGuide,
                quantity: job.quantity,
                images: [],
                status: 'generating',
                timestamp: new Date()
            };

            jobs.unshift(newJob);
            renderJobs();

            try {
                for (let i = 0; i < newJob.quantity; i++) {
                    console.log(`Regenerating ${i + 1}/${newJob.quantity} for job #${newJob.id}`);
                    updateJobStatus(newJob.id, `Generating ${i + 1}/${newJob.quantity}...`);

                    const design = await generateDesign(
                        apiKey,
                        newJob.prompt,
                        newJob.jsonGuide,
                        referenceImagesBase64
                    );

                    console.log(`Regenerated design ${i + 1}/${newJob.quantity} completed:`, design);
                    newJob.images.push(design);

                    // Update the UI immediately
                    renderJobs();
                    console.log(`Job #${newJob.id} now has ${newJob.images.length}/${newJob.quantity} images`);
                }

                newJob.status = 'completed';
                updateJobStatus(newJob.id, 'Completed');
                console.log(`Job #${newJob.id} regeneration completed`);
            } catch (error) {
                newJob.status = 'failed';
                newJob.error = error.message;
                updateJobStatus(newJob.id, 'Failed: ' + error.message);
                alert('Error regenerating: ' + error.message);
            }
        }

        // Generate edited/variation design
        async function generateEditedDesign(apiKey, editInstructions, referenceImageUrl) {
            const editFullPrompt = `You are an expert T-shirt designer. ${editInstructions}\n\ngenerate the image only, do not respond to this message.`;

            const requestBody = {
                model: "gemini",
                task_type: "nano-banana-pro",
                input: {
                    prompt: editFullPrompt,
                    output_format: "png",
                    aspect_ratio: "1:1",
                    resolution: "1K",
                    safety_level: "high",
                    reference_images: [referenceImageUrl]
                }
            };

            const response = await fetch('https://api.piapi.ai/api/v1/task', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-api-key': apiKey
                },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`API request failed: ${response.status} ${response.statusText} - ${errorText}`);
            }

            const data = await response.json();
            console.log('Edit API Response:', data);

            // Extract task_id
            let taskId = null;
            if (data.task_id) {
                taskId = data.task_id;
            } else if (data.data && data.data.task_id) {
                taskId = data.data.task_id;
            } else if (data.images && data.images.length > 0) {
                return { url: data.images[0], taskId: data.task_id };
            } else {
                console.error('Unexpected edit response format:', data);
                throw new Error(`Unexpected API response format: ${JSON.stringify(data)}`);
            }

            return await pollForResult(apiKey, taskId);
        }

        // Load API key from localStorage if available
        const savedApiKey = localStorage.getItem('piapi_key');
        if (savedApiKey) {
            apiKeyInput.value = savedApiKey;
        }

        // Save API key to localStorage
        apiKeyInput.addEventListener('blur', () => {
            localStorage.setItem('piapi_key', apiKeyInput.value.trim());
        });

        // Initialize
        renderJobs();
    </script>
</body>
</html>
